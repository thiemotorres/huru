name: Release

# Push a tag like v0.2.0 to publish a signed APK as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HURU_KEYSTORE_PASSWORD: ${{ secrets.HURU_KEYSTORE_PASSWORD }}
      HURU_KEY_ALIAS: ${{ secrets.HURU_KEY_ALIAS }}
      HURU_KEY_PASSWORD: ${{ secrets.HURU_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: |
          echo "${{ secrets.HURU_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/huru.jks"
          echo "HURU_KEYSTORE_FILE=$RUNNER_TEMP/huru.jks" >> "$GITHUB_ENV"
      - name: Build
        run: |
          V="${GITHUB_REF_NAME#v}"
          ARGS="-PversionName=$V -PversionCode=${{ github.run_number }}"
          ./gradlew testDebugUnitTest assembleRelease $ARGS
          cp app/build/outputs/apk/release/app-release.apk "huru-$V.apk"
          ./gradlew assembleRelease $ARGS -Pstore=amazon
          mkdir amazon && cp app/build/outputs/apk/release/app-release.apk "amazon/huru-$V-amazon.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" huru-*.apk --title "Huru $GITHUB_REF_NAME" --generate-notes
      - name: Keep Amazon build (no Ko-fi QR) as artifact
        uses: actions/upload-artifact@v4
        with:
          name: huru-amazon-apk
          path: amazon/*.apk
      - name: Remove keystore
        if: always()
        run: rm -f "$HURU_KEYSTORE_FILE"
